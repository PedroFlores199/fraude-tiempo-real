apiVersion: 1

datasources:
  - name: Métricas de fraude
    uid: postgres-fraude
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    isDefault: true
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
