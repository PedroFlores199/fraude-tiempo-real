name: fraude-tiempo-real

x-entorno: &entorno
  KAFKA_SERVIDORES: kafka:29092
  MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0
  MONGO_DB: fraude
  REDIS_HOST: redis
  REDIS_PUERTO: "6379"
  POSTGRES_DSN: postgresql://${POSTGRES_USER:-fraude}:${POSTGRES_PASSWORD:-fraude}@postgres:5432/${POSTGRES_DB:-fraude}
  MODELO_RUTA: /opt/modelos/modelo.joblib
  CHECKPOINT_DIR: /opt/checkpoints
  TPS: ${TPS:-100}
  TASA_FRAUDE: ${TASA_FRAUDE:-0.015}
  UMBRAL_REVISION: ${UMBRAL_REVISION:-0.3}
  UMBRAL_BLOQUEO: ${UMBRAL_BLOQUEO:-0.6}
  NIVEL_LOG: ${NIVEL_LOG:-INFO}

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: fraude-tiempo-real/app:latest
  environment: *entorno

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: fraude-tiempo-real/airflow:latest
  environment:
    <<: *entorno
    PYTHONPATH: /opt/proyecto
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Madrid
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/airflow
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./comun:/opt/proyecto/comun:ro
    - ./esquema:/opt/proyecto/esquema:ro
    - ./generador:/opt/proyecto/generador:ro
    - ./streaming:/opt/proyecto/streaming:ro
    - ./entrenamiento:/opt/proyecto/entrenamiento:ro
    - modelos:/opt/modelos

services:
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,EXTERNO://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for topico in transacciones:6 errores:1 decisiones:6; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$${topico%%:*}" --partitions "$${topico##*:}" --replication-factor 1
        done
    restart: "no"

  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-datos:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}) } if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ESQUEMAS_DIR: /scripts/esquemas
      MONGO_DB: fraude
    volumes:
      - ./mongo:/scripts:ro
    command: ["mongosh", "mongodb://mongodb:27017/?replicaSet=rs0", "--quiet", "/scripts/init.js"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraude}
      POSTGRES_DB: ${POSTGRES_DB:-fraude}
      AIRFLOW_DB_USER: airflow
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      AIRFLOW_DB_NAME: airflow
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fraude.json
      POSTGRES_USER: ${POSTGRES_USER:-fraude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraude}
      POSTGRES_DB: ${POSTGRES_DB:-fraude}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  perfiles:
    <<: *app
    command: ["python", "-m", "generador.perfiles", "--clientes", "1000"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: "no"

  entrenamiento-inicial:
    <<: *app
    command: ["python", "-m", "entrenamiento.entrenar", "--si-no-existe"]
    volumes:
      - modelos:/opt/modelos
    restart: "no"

  streaming:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: fraude-tiempo-real/streaming:latest
    environment:
      <<: *entorno
      KAFKA_OFFSETS_INICIALES: earliest
    ports:
      - "4040:4040"
    volumes:
      - modelos:/opt/modelos
      - checkpoints:/opt/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      perfiles:
        condition: service_completed_successfully
      entrenamiento-inicial:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  generador:
    <<: *app
    command: ["python", "-m", "generador.productor"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      perfiles:
        condition: service_completed_successfully
      streaming:
        condition: service_started
    restart: unless-stopped

  api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  panel:
    <<: *app
    command:
      - streamlit
      - run
      - panel/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command: version
    environment:
      <<: *entorno
      PYTHONPATH: /opt/proyecto
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/airflow
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mongo-datos:
  postgres-datos:
  modelos:
  checkpoints:
